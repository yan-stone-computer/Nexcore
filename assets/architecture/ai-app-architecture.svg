<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">大模型应用分层架构</title>
  <desc id="desc">用户输入先经过规则与意图路由，分别进入本地快答、数据库直查或检索增强链路。检索结果与记忆一起组装进模型上下文，最后通过流式输出返回，并写回会话状态。</desc>
  <defs>
    <marker id="arrow-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#0b8797"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="28" fill="#f7fbfc"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <text x="42" y="56" font-size="13" font-weight="700" fill="#0d7387" letter-spacing="1.2">AI APPLICATION ARCHITECTURE</text>

    <g>
      <rect x="36" y="198" width="142" height="118" rx="18" fill="#ffffff" stroke="#bcdce4" stroke-width="1.5"/>
      <text x="107" y="246" text-anchor="middle" font-size="19" font-weight="700" fill="#18323b">用户输入</text>
      <text x="107" y="273" text-anchor="middle" font-size="12" fill="#58737d">问题 · 图片 · 附件</text>
    </g>

    <g>
      <rect x="214" y="178" width="164" height="158" rx="20" fill="#e8faf5" stroke="#54d0b1" stroke-width="2"/>
      <text x="240" y="214" font-size="12" font-weight="700" fill="#0b7d6c" letter-spacing="1.1">ROUTER</text>
      <text x="240" y="246" font-size="20" font-weight="700" fill="#18323b">规则与意图路由</text>
      <text x="240" y="277" font-size="13" fill="#58737d">硬规则优先</text>
      <text x="240" y="301" font-size="13" fill="#58737d">关键词打分兜底</text>
    </g>

    <g>
      <rect x="420" y="64" width="190" height="132" rx="16" fill="#ffffff" stroke="#bcdce4" stroke-width="1.5"/>
      <text x="446" y="100" font-size="12" font-weight="700" fill="#0d7387" letter-spacing="1">RETRIEVAL</text>
      <text x="446" y="132" font-size="18" font-weight="700" fill="#18323b">RAG + GraphRAG</text>
      <text x="446" y="158" font-size="12" fill="#58737d">文档召回 · 图谱关系</text>
      <text x="446" y="178" font-size="12" fill="#58737d">重排与引用溯源</text>
    </g>

    <g>
      <rect x="654" y="166" width="154" height="138" rx="18" fill="#ffffff" stroke="#bcdce4" stroke-width="1.5"/>
      <text x="680" y="203" font-size="12" font-weight="700" fill="#0d7387" letter-spacing="1">CONTEXT</text>
      <text x="680" y="235" font-size="18" font-weight="700" fill="#18323b">上下文组装</text>
      <text x="680" y="261" font-size="12" fill="#58737d">系统规则</text>
      <text x="680" y="282" font-size="12" fill="#58737d">检索结果 · 记忆</text>
    </g>

    <g>
      <rect x="836" y="186" width="88" height="98" rx="16" fill="#10272f"/>
      <text x="880" y="225" text-anchor="middle" font-size="16" font-weight="700" fill="#f4fbfc">模型生成</text>
      <text x="880" y="250" text-anchor="middle" font-size="11" fill="#bad3d9">流式输出</text>
    </g>

    <g>
      <rect x="258" y="386" width="154" height="72" rx="13" fill="#ffffff" stroke="#8fdbad"/>
      <text x="335" y="417" text-anchor="middle" font-size="16" font-weight="700" fill="#18323b">本地快答</text>
      <text x="335" y="439" text-anchor="middle" font-size="11" fill="#58737d">问候 · 导航 · FAQ</text>
    </g>
    <g>
      <rect x="440" y="386" width="154" height="72" rx="13" fill="#ffffff" stroke="#bcdce4"/>
      <text x="517" y="417" text-anchor="middle" font-size="16" font-weight="700" fill="#18323b">结构化查询</text>
      <text x="517" y="439" text-anchor="middle" font-size="11" fill="#58737d">数据库直接返回</text>
    </g>
    <g>
      <rect x="622" y="386" width="184" height="72" rx="13" fill="#ffffff" stroke="#bcdce4"/>
      <text x="714" y="417" text-anchor="middle" font-size="16" font-weight="700" fill="#18323b">状态与记忆</text>
      <text x="714" y="439" text-anchor="middle" font-size="11" fill="#58737d">会话 · 用户偏好 · 结果</text>
    </g>

    <g fill="none" stroke="#0b8797" stroke-width="2.3" marker-end="url(#arrow-ai)">
      <path d="M178 257h28"/>
      <path d="M378 238h34"/>
      <path d="M516 196V132"/>
      <path d="M610 130h34v103"/>
      <path d="M808 235h22"/>
      <path d="M296 336v42"/>
      <path d="M452 274v104"/>
      <path d="M714 304v74"/>
    </g>
    <path d="M880 284v102H806" fill="none" stroke="#18b795" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-ai)"/>
    <text x="832" y="376" font-size="11" fill="#47717c">结果写回</text>
    <text x="480" y="514" text-anchor="middle" font-size="13" fill="#466873">能用规则或数据库解决的问题，不交给大模型</text>
  </g>
</svg>
