<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">免费模型 Auto 路由流程</title>
  <desc id="desc">请求先识别任务特征，再经过启用状态、凭据、能力、窗口和免费模式等硬条件过滤。候选端点随后按工具可靠性、真实延迟、成本和上下文窗口评分，选择可用端点并写入运行轨迹。连接级失败才进入安全回退。</desc>
  <defs>
    <marker id="arrow-route" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#0b8797"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="28" fill="#f7fbfc"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <text x="42" y="56" font-size="13" font-weight="700" fill="#0d7387" letter-spacing="1.2">MODEL AUTO ROUTING</text>

    <g>
      <rect x="38" y="190" width="132" height="126" rx="17" fill="#ffffff" stroke="#bcdce4"/>
      <text x="104" y="228" text-anchor="middle" font-size="17" font-weight="700" fill="#18323b">请求特征</text>
      <text x="104" y="255" text-anchor="middle" font-size="11" fill="#58737d">文字 / 图片 / 附件</text>
      <text x="104" y="276" text-anchor="middle" font-size="11" fill="#58737d">工具 / 长上下文</text>
    </g>
    <g>
      <rect x="202" y="174" width="166" height="158" rx="18" fill="#e8faf5" stroke="#54d0b1" stroke-width="2"/>
      <text x="228" y="209" font-size="12" font-weight="700" fill="#0b7d6c" letter-spacing="1">HARD FILTER</text>
      <text x="228" y="240" font-size="18" font-weight="700" fill="#18323b">硬条件过滤</text>
      <text x="228" y="267" font-size="11" fill="#58737d">已启用 · 凭据有效</text>
      <text x="228" y="287" font-size="11" fill="#58737d">能力匹配 · 窗口足够</text>
      <text x="228" y="307" font-size="11" fill="#58737d">免费模式允许</text>
    </g>
    <g>
      <rect x="400" y="174" width="176" height="158" rx="18" fill="#ffffff" stroke="#bcdce4"/>
      <text x="426" y="209" font-size="12" font-weight="700" fill="#0d7387" letter-spacing="1">SCORING</text>
      <text x="426" y="240" font-size="18" font-weight="700" fill="#18323b">候选评分</text>
      <text x="426" y="267" font-size="11" fill="#58737d">工具可靠性</text>
      <text x="426" y="287" font-size="11" fill="#58737d">真实首字延迟 EWMA</text>
      <text x="426" y="307" font-size="11" fill="#58737d">成本 · 窗口 · 历史失败</text>
    </g>
    <g>
      <rect x="608" y="190" width="150" height="126" rx="17" fill="#10272f"/>
      <text x="683" y="228" text-anchor="middle" font-size="17" font-weight="700" fill="#f4fbfc">选择端点</text>
      <text x="683" y="255" text-anchor="middle" font-size="11" fill="#bad3d9">请求前的最终决定</text>
      <text x="683" y="276" text-anchor="middle" font-size="11" fill="#bad3d9">记录被过滤原因</text>
    </g>
    <g>
      <rect x="790" y="174" width="128" height="158" rx="17" fill="#e8faf5" stroke="#54d0b1"/>
      <text x="854" y="211" text-anchor="middle" font-size="17" font-weight="700" fill="#18323b">执行</text>
      <text x="854" y="237" text-anchor="middle" font-size="17" font-weight="700" fill="#18323b">调用</text>
      <text x="854" y="269" text-anchor="middle" font-size="11" fill="#58737d">成功 / 失败 / 429</text>
      <text x="854" y="289" text-anchor="middle" font-size="11" fill="#58737d">写入轨迹</text>
    </g>

    <g fill="none" stroke="#0b8797" stroke-width="2.3" marker-end="url(#arrow-route)">
      <path d="M170 253h32"/>
      <path d="M368 253h32"/>
      <path d="M576 253h32"/>
      <path d="M758 253h32"/>
    </g>

    <g>
      <rect x="342" y="390" width="212" height="78" rx="15" fill="#ffffff" stroke="#bcdce4"/>
      <text x="448" y="421" text-anchor="middle" font-size="15" font-weight="700" fill="#18323b">更新真实延迟</text>
      <text x="448" y="445" text-anchor="middle" font-size="11" fill="#58737d">成功调用后进入 EWMA</text>
    </g>
    <g>
      <rect x="604" y="390" width="212" height="78" rx="15" fill="#ffffff" stroke="#f0b3a7"/>
      <text x="710" y="421" text-anchor="middle" font-size="15" font-weight="700" fill="#18323b">安全回退</text>
      <text x="710" y="445" text-anchor="middle" font-size="11" fill="#58737d">连接级失败才重试，避免重复副作用</text>
    </g>
    <g fill="none" stroke="#0b8797" stroke-width="2" marker-end="url(#arrow-route)">
      <path d="M854 332v42H448v16"/>
      <path d="M854 332v58"/>
    </g>
    <path d="M266 390v-42" fill="none" stroke="#18b795" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-route)"/>
    <text x="480" y="514" text-anchor="middle" font-size="13" fill="#466873">免费只是硬条件之一，能力、窗口和真实延迟同样参与选择</text>
  </g>
</svg>
