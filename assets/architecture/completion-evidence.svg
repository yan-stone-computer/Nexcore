<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Agent 完成状态的可验证证据链</title>
  <desc id="desc">工具执行后同时产生调用回执、文件差异、语法检查、渲染截图和视觉复核。这些证据共同进入交付门禁，只有路径可追溯且验证项通过时才标记为已验证完成。</desc>
  <defs>
    <marker id="arrow-evidence" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#0b8797"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="28" fill="#f7fbfc"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <text x="42" y="56" font-size="13" font-weight="700" fill="#0d7387" letter-spacing="1.2">COMPLETION EVIDENCE</text>

    <g>
      <rect x="38" y="198" width="134" height="126" rx="17" fill="#ffffff" stroke="#bcdce4"/>
      <text x="105" y="238" text-anchor="middle" font-size="17" font-weight="700" fill="#18323b">工具执行</text>
      <text x="105" y="265" text-anchor="middle" font-size="11" fill="#58737d">模型只提出动作</text>
      <text x="105" y="286" text-anchor="middle" font-size="11" fill="#58737d">系统真正调用</text>
    </g>

    <g>
      <rect x="208" y="106" width="142" height="86" rx="14" fill="#e8faf5" stroke="#54d0b1"/>
      <text x="279" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#18323b">调用回执</text>
      <text x="279" y="164" text-anchor="middle" font-size="11" fill="#58737d">参数 · 耗时 · 退出码</text>
    </g>
    <g>
      <rect x="208" y="222" width="142" height="86" rx="14" fill="#ffffff" stroke="#bcdce4"/>
      <text x="279" y="256" text-anchor="middle" font-size="16" font-weight="700" fill="#18323b">文件差异</text>
      <text x="279" y="280" text-anchor="middle" font-size="11" fill="#58737d">路径 · 新增 · 删除</text>
    </g>
    <g>
      <rect x="208" y="338" width="142" height="86" rx="14" fill="#ffffff" stroke="#bcdce4"/>
      <text x="279" y="372" text-anchor="middle" font-size="16" font-weight="700" fill="#18323b">代码检查</text>
      <text x="279" y="396" text-anchor="middle" font-size="11" fill="#58737d">语法 · 引用 · 构建</text>
    </g>
    <g>
      <rect x="392" y="106" width="150" height="86" rx="14" fill="#ffffff" stroke="#bcdce4"/>
      <text x="467" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#18323b">真实渲染</text>
      <text x="467" y="164" text-anchor="middle" font-size="11" fill="#58737d">页面转成 PNG</text>
    </g>
    <g>
      <rect x="392" y="222" width="150" height="86" rx="14" fill="#e8faf5" stroke="#54d0b1"/>
      <text x="467" y="256" text-anchor="middle" font-size="16" font-weight="700" fill="#18323b">视觉复核</text>
      <text x="467" y="280" text-anchor="middle" font-size="11" fill="#58737d">构图 · 裁切 · 可读性</text>
    </g>
    <g>
      <rect x="392" y="338" width="150" height="86" rx="14" fill="#ffffff" stroke="#bcdce4"/>
      <text x="467" y="372" text-anchor="middle" font-size="16" font-weight="700" fill="#18323b">最终路径</text>
      <text x="467" y="396" text-anchor="middle" font-size="11" fill="#58737d">用户可以直接打开</text>
    </g>

    <g>
      <rect x="596" y="174" width="158" height="174" rx="22" fill="#10272f"/>
      <text x="675" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#7fe3c3" letter-spacing="1">GATE</text>
      <text x="675" y="252" text-anchor="middle" font-size="19" font-weight="700" fill="#f4fbfc">交付门禁</text>
      <text x="675" y="281" text-anchor="middle" font-size="11" fill="#bad3d9">文件存在且在工作区</text>
      <text x="675" y="301" text-anchor="middle" font-size="11" fill="#bad3d9">命令与页面可运行</text>
      <text x="675" y="321" text-anchor="middle" font-size="11" fill="#bad3d9">证据与路径可追溯</text>
    </g>
    <g>
      <rect x="808" y="174" width="110" height="174" rx="18" fill="#e8faf5" stroke="#54d0b1" stroke-width="2"/>
      <text x="863" y="216" text-anchor="middle" font-size="17" font-weight="700" fill="#18323b">已验证</text>
      <text x="863" y="243" text-anchor="middle" font-size="17" font-weight="700" fill="#18323b">完成</text>
      <text x="863" y="278" text-anchor="middle" font-size="11" fill="#58737d">只陈述有证据</text>
      <text x="863" y="298" text-anchor="middle" font-size="11" fill="#58737d">的部分</text>
    </g>

    <g fill="none" stroke="#0b8797" stroke-width="2.3" marker-end="url(#arrow-evidence)">
      <path d="M172 260h14v-111h22"/>
      <path d="M172 260h36"/>
      <path d="M172 260h14v121h22"/>
      <path d="M350 149h20"/>
      <path d="M350 265h20"/>
      <path d="M350 381h20"/>
      <path d="M542 149h50v78"/>
      <path d="M542 265h54"/>
      <path d="M542 381h50v-78"/>
      <path d="M754 260h54"/>
    </g>
    <text x="480" y="514" text-anchor="middle" font-size="13" fill="#466873">模型可以解释完成，但只有系统证据能够确认完成</text>
  </g>
</svg>
