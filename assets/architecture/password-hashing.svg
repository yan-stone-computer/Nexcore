<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">PBKDF2 慢哈希注册与校验流程</title>
  <desc id="desc">注册时生成随机盐，通过 PBKDF2-HMAC-SHA256 迭代派生哈希，并保存算法、迭代参数、盐和哈希。校验时使用相同参数重新派生，再通过恒时比较判断结果。</desc>
  <defs>
    <marker id="arrow-hash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#0b8797"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="28" fill="#f7fbfc"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <text x="42" y="56" font-size="13" font-weight="700" fill="#0d7387" letter-spacing="1.2">PASSWORD HASHING</text>
    <text x="42" y="104" font-size="12" font-weight="700" fill="#58737d" letter-spacing="1">注册</text>

    <g>
      <rect x="42" y="126" width="136" height="86" rx="15" fill="#ffffff" stroke="#bcdce4"/>
      <text x="110" y="161" text-anchor="middle" font-size="17" font-weight="700" fill="#18323b">原始口令</text>
      <text x="110" y="184" text-anchor="middle" font-size="11" fill="#58737d">不落盘</text>
    </g>
    <g>
      <rect x="208" y="126" width="136" height="86" rx="15" fill="#e8faf5" stroke="#54d0b1"/>
      <text x="276" y="161" text-anchor="middle" font-size="17" font-weight="700" fill="#18323b">随机盐</text>
      <text x="276" y="184" text-anchor="middle" font-size="11" fill="#58737d">每个记录独立</text>
    </g>
    <g>
      <rect x="374" y="112" width="206" height="114" rx="18" fill="#10272f"/>
      <text x="477" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#f4fbfc">PBKDF2-HMAC-SHA256</text>
      <text x="477" y="176" text-anchor="middle" font-size="12" fill="#bad3d9">迭代参数决定计算成本</text>
      <text x="477" y="200" text-anchor="middle" font-size="12" fill="#bad3d9">输出定长派生值</text>
    </g>
    <g>
      <rect x="610" y="126" width="158" height="86" rx="15" fill="#ffffff" stroke="#bcdce4"/>
      <text x="689" y="161" text-anchor="middle" font-size="17" font-weight="700" fill="#18323b">存储记录</text>
      <text x="689" y="184" text-anchor="middle" font-size="11" fill="#58737d">算法 · 参数 · 盐 · 哈希</text>
    </g>

    <g fill="none" stroke="#0b8797" stroke-width="2.3" marker-end="url(#arrow-hash)">
      <path d="M178 169h22"/>
      <path d="M344 169h22"/>
      <path d="M580 169h22"/>
    </g>

    <line x1="42" y1="266" x2="918" y2="266" stroke="#d5e9ed" stroke-width="1.5"/>
    <text x="42" y="302" font-size="12" font-weight="700" fill="#58737d" letter-spacing="1">校验</text>

    <g>
      <rect x="42" y="326" width="136" height="86" rx="15" fill="#ffffff" stroke="#bcdce4"/>
      <text x="110" y="361" text-anchor="middle" font-size="17" font-weight="700" fill="#18323b">候选口令</text>
      <text x="110" y="384" text-anchor="middle" font-size="11" fill="#58737d">本轮输入</text>
    </g>
    <g>
      <rect x="208" y="326" width="154" height="86" rx="15" fill="#ffffff" stroke="#bcdce4"/>
      <text x="285" y="361" text-anchor="middle" font-size="17" font-weight="700" fill="#18323b">读取盐与参数</text>
      <text x="285" y="384" text-anchor="middle" font-size="11" fill="#58737d">来自存储记录</text>
    </g>
    <g>
      <rect x="392" y="312" width="170" height="114" rx="18" fill="#e8faf5" stroke="#54d0b1" stroke-width="2"/>
      <text x="477" y="347" text-anchor="middle" font-size="17" font-weight="700" fill="#18323b">重新派生</text>
      <text x="477" y="374" text-anchor="middle" font-size="11" fill="#58737d">使用完全相同的参数</text>
    </g>
    <g>
      <rect x="592" y="326" width="170" height="86" rx="15" fill="#ffffff" stroke="#bcdce4"/>
      <text x="677" y="361" text-anchor="middle" font-size="17" font-weight="700" fill="#18323b">恒时比较</text>
      <text x="677" y="384" text-anchor="middle" font-size="11" fill="#58737d">避免长度与位置泄漏</text>
    </g>
    <g>
      <rect x="794" y="326" width="124" height="86" rx="15" fill="#10272f"/>
      <text x="856" y="361" text-anchor="middle" font-size="17" font-weight="700" fill="#f4fbfc">通过 / 拒绝</text>
      <text x="856" y="384" text-anchor="middle" font-size="11" fill="#bad3d9">不保存明文</text>
    </g>
    <g fill="none" stroke="#0b8797" stroke-width="2.3" marker-end="url(#arrow-hash)">
      <path d="M178 369h22"/>
      <path d="M362 369h22"/>
      <path d="M562 369h22"/>
      <path d="M762 369h22"/>
    </g>
    <text x="480" y="514" text-anchor="middle" font-size="13" fill="#466873">慢哈希的目标是提高批量猜测成本，不是把密码加密后还原</text>
  </g>
</svg>
