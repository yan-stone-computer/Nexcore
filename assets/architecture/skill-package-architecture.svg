<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">AI 技能包结构与渐进式加载</title>
  <desc id="desc">技能目录由 SKILL.md、references 和 scripts 组成。模型先根据 description 判断是否触发，再加载 SKILL.md 正文，并仅在需要时读取参考文件或运行脚本。</desc>
  <defs>
    <marker id="arrow-skill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#0b8797"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="28" fill="#f7fbfc"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <text x="42" y="56" font-size="13" font-weight="700" fill="#0d7387" letter-spacing="1.2">SKILL PACKAGE</text>

    <g>
      <rect x="38" y="204" width="144" height="118" rx="18" fill="#ffffff" stroke="#bcdce4" stroke-width="1.5"/>
      <text x="110" y="248" text-anchor="middle" font-size="18" font-weight="700" fill="#18323b">用户任务</text>
      <text x="110" y="276" text-anchor="middle" font-size="12" fill="#58737d">匹配技能描述</text>
    </g>

    <g>
      <rect x="218" y="190" width="154" height="146" rx="18" fill="#e8faf5" stroke="#54d0b1" stroke-width="2"/>
      <text x="244" y="225" font-size="12" font-weight="700" fill="#0b7d6c" letter-spacing="1">DISCOVERY</text>
      <text x="244" y="257" font-size="18" font-weight="700" fill="#18323b">触发判断</text>
      <text x="244" y="285" font-size="12" fill="#58737d">description 命中</text>
      <text x="244" y="307" font-size="12" fill="#58737d">只加载必要内容</text>
    </g>

    <rect x="410" y="88" width="400" height="362" rx="24" fill="#ffffff" stroke="#bcdce4" stroke-width="1.5" stroke-dasharray="7 7"/>
    <text x="438" y="124" font-size="12" font-weight="700" fill="#0d7387" letter-spacing="1">SKILL PACKAGE BOUNDARY</text>

    <g>
      <rect x="438" y="148" width="150" height="238" rx="16" fill="#10272f"/>
      <text x="513" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#f4fbfc">SKILL.md</text>
      <text x="462" y="218" font-size="12" fill="#bad3d9">name / description</text>
      <text x="462" y="244" font-size="12" fill="#bad3d9">触发条件</text>
      <text x="462" y="270" font-size="12" fill="#bad3d9">执行流程</text>
      <text x="462" y="296" font-size="12" fill="#bad3d9">输出格式</text>
      <text x="462" y="322" font-size="12" fill="#bad3d9">使用边界</text>
    </g>

    <g>
      <rect x="614" y="148" width="168" height="100" rx="16" fill="#e8faf5" stroke="#54d0b1" stroke-width="1.5"/>
      <text x="640" y="181" font-size="16" font-weight="700" fill="#18323b">references/</text>
      <text x="640" y="207" font-size="12" fill="#58737d">规范 · 模板 · 知识库</text>
      <text x="640" y="227" font-size="12" fill="#58737d">按需读取</text>
    </g>
    <g>
      <rect x="614" y="270" width="168" height="116" rx="16" fill="#ffffff" stroke="#bcdce4"/>
      <text x="640" y="303" font-size="16" font-weight="700" fill="#18323b">scripts/</text>
      <text x="640" y="329" font-size="12" fill="#58737d">可执行辅助脚本</text>
      <text x="640" y="349" font-size="12" fill="#58737d">运行前审查源码</text>
    </g>

    <g fill="none" stroke="#0b8797" stroke-width="2.3" marker-end="url(#arrow-skill)">
      <path d="M182 264h26"/>
      <path d="M372 264h26"/>
      <path d="M588 198h16"/>
      <path d="M588 326h16"/>
    </g>

    <g>
      <rect x="842" y="188" width="88" height="150" rx="18" fill="#e8faf5" stroke="#54d0b1" stroke-width="2"/>
      <text x="886" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#18323b">执行</text>
      <text x="886" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#18323b">任务</text>
      <text x="886" y="286" text-anchor="middle" font-size="11" fill="#58737d">渐进披露</text>
      <text x="886" y="306" text-anchor="middle" font-size="11" fill="#58737d">局部加载</text>
    </g>
    <path d="M810 264h32" fill="none" stroke="#0b8797" stroke-width="2.3" marker-end="url(#arrow-skill)"/>
    <text x="480" y="508" text-anchor="middle" font-size="13" fill="#466873">小而准的入口描述，比堆满提示词更容易被模型正确触发</text>
  </g>
</svg>
